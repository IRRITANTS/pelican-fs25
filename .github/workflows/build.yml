name: build image
on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: docker
          pull: true
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/pelican-fs25:latest
            ghcr.io/${{ steps.tag.outputs.owner }}/pelican-fs25:${{ steps.tag.outputs.date }}
